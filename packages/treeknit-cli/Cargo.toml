[package]
name = "treeknit-cli"
description = "Command-line interface for TreeKnit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
keywords.workspace = true
license.workspace = true

[[bin]]
name = "treeknit"
path = "src/main.rs"

[dependencies]
clap.workspace = true
color-eyre.workspace = true
ctor.workspace = true
eyre.workspace = true
log.workspace = true
rayon.workspace = true
serde_json.workspace = true
simplelog.workspace = true
thiserror.workspace = true
treeknit-core.workspace = true
treeknit-io = { workspace = true, features = ["clap", "embedded-examples"] }
ureq.workspace = true

# jemalloc on the Linux release targets, where long runs allocate the most; the macOS and Windows
# builds keep the system allocator and need no C build of jemalloc.
[target.'cfg(all(target_os = "linux", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator.workspace = true

[dev-dependencies]
indoc.workspace = true
pretty_assertions.workspace = true
rstest.workspace = true
serde_json.workspace = true
strum.workspace = true
tempfile.workspace = true
treeknit-testing.workspace = true

[lints]
workspace = true
