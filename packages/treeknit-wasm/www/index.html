<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TreeKnit</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <main>
    <h1>TreeKnit</h1>
    <p>Infer reassortment from segment trees: maximally compatible clades (MCCs) for every pair of trees and, for two trees, an ancestral reassortment graph (ARG).</p>

    <form id="form">
      <fieldset>
        <legend>Trees</legend>
        <label>Newick files, one per segment <input id="files" type="file" multiple accept=".nwk,.newick,.tre,.tree,.txt"></label>
        <button id="example" type="button">Load example</button>
        <ul id="trees"></ul>
      </fieldset>

      <fieldset>
        <legend>Settings</legend>
        <label>γ (cost of a reassortment) <input id="gamma" type="number" min="0" step="any" value="2" required></label>
        <label>Resolution
          <select id="resolve">
            <option value="matched" selected>matched</option>
            <option value="strict">strict</option>
            <option value="liberal">liberal</option>
            <option value="none">none</option>
          </select>
        </label>
        <label>Seed <input id="seed" type="number" min="0" step="1" value="1" required></label>
      </fieldset>

      <button id="run" type="submit" disabled>Run</button>
      <output id="status"></output>
    </form>

    <section id="results" hidden>
      <h2>Results</h2>
      <div id="pairs"></div>
      <p id="arg"></p>
      <p id="downloads"></p>
    </section>
  </main>
</body>
</html>
