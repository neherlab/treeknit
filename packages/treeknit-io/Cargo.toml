[package]
name = "treeknit-io"
description = "File formats for TreeKnit: Newick, MCC JSON, extended Newick ARGs, auspice JSON"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
keywords.workspace = true
license.workspace = true

[features]
# TypeScript declarations of the boundary types for the WebAssembly bindings; the tsify derive
# emits wasm-bindgen custom sections.
tsify = ["dep:tsify", "dep:wasm-bindgen"]
# The Newick texts of the examples in the binary, for `treeknit --example`. The WebAssembly build
# leaves them out: the web app loads each example file on demand.
embedded-examples = []

[dependencies]
base64.workspace = true
flate2.workspace = true
log.workspace = true
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true
treeknit-core.workspace = true
tsify = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
zip.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
rand.workspace = true
rand_xoshiro.workspace = true
rstest.workspace = true

# Cargo runs the tests of an example only with `test = true`. The tests of this example take
# milliseconds and check the generator, so they run with the other tests; the accuracy example
# has no tests of its own.
[[example]]
name = "large_tree_pair"
test = true

[lints]
workspace = true
