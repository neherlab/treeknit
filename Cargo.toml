[workspace]
resolver = "3"
members = ["packages/treeknit-core", "packages/treeknit-io", "packages/treeknit-cli"]

[workspace.package]
description = "Inference of reassortment from segment trees"
version = "0.1.0"
repository = "https://github.com/neherlab/treeknit-rs"
homepage = "https://github.com/neherlab/treeknit-rs"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
keywords = ["biology", "evolution", "phylogenetics", "reassortment", "virus"]


# Dependencies build optimized in development and tests, so the test suites
# stay fast while the workspace crates keep fast incremental builds.
[profile.dev.package."*"]
opt-level = 2

# Development build with optimized workspace crates, for long runs on real
# datasets. Rebuilds are slower than `dev`.
[profile.dev-opt]
inherits = "dev"
opt-level = 1
lto = "off"

# Optimized build that stays fast to rebuild, for local runs. Line tables keep
# readable backtraces, and overflow checks stay on for numeric correctness.
[profile.release]
codegen-units = 16
debug = "line-tables-only"
incremental = true
lto = "off"
overflow-checks = true

# The shipped artifact: fat LTO and one codegen unit for speed. Integer overflow
# checks stay in the release profile for development and are off here.
# Stripping the debug info makes the binaries several times smaller; backtraces
# keep function names but lose file and line numbers.
[profile.dist]
inherits = "release"
codegen-units = 1
incremental = false
lto = "fat"
overflow-checks = false
strip = "debuginfo"

# The shipped artifact with full debug info, for profilers.
[profile.profiling]
inherits = "dist"
debug = true
strip = "none"

# Benchmarks measure the shipped artifact, with debug info kept for profilers.
[profile.bench]
inherits = "dist"
strip = "none"


[workspace.dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
fixedbitset = "=0.5.7"
log = "=0.4.34"
rand = "=0.8.8"
rand_xoshiro = "=0.6.0"
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
simplelog = "=0.12.2"

treeknit-core = { path = "packages/treeknit-core" }
treeknit-io = { path = "packages/treeknit-io" }
