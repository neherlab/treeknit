name: "Test CLI compatibility"

# Test the binaries of cli-build.yml where users run them: in many Linux
# distribution images, on macOS and Windows runners, as PyPI wheels installed by
# pip, and in the Docker images of dev/docker/prod-images. Called by ci.yml and
# release.yml after cli-build.yml, whose artifacts belong to the same run. The
# job "wheels" uploads the wheels as the artifact pypi-wheels, which the release
# publishes to PyPI.
on:
  workflow_call:
    inputs:
      wheel_version:
        description: "Version of the wheels: the release version, or <crate version>.dev0"
        required: true
        type: string
      docker:
        description: "Build the Docker images and run each of them"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  CARGO_INCREMENTAL: "0"
  KACHE_STORE: ${{ github.workspace }}/.cache/kache
  # The binaries of a release report the release version; the binaries of CI
  # report <crate version>-dev, which differs from the wheel version
  # <crate version>.dev0, so CI checks only that they start.
  RELEASE_VERSION: ${{ !contains(inputs.wheel_version, '.dev') && inputs.wheel_version || '' }}
  # Logging in raises the pull limit of Docker Hub; pull requests run without it.
  DOCKERHUB_LOGIN: ${{ github.event_name != 'pull_request' && secrets.NEHERLAB_BOT_DOCKERHUB_TOKEN != '' && '1' || '' }}

jobs:
  linux-distros:
    name: "Linux distributions (${{ matrix.target }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Log in to Docker Hub"
        if: env.DOCKERHUB_LOGIN == '1'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_USERNAME }}
          password: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_TOKEN }}

      - name: "Download the binary"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: treeknit-${{ matrix.target }}
          path: ".out"

      - name: "Run in the distribution images"
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x ".out/treeknit-${TARGET}"
          dev/cross/test-distros treeknit "${TARGET}"

  macos:
    name: "macOS (${{ matrix.runner }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: "macos-15-intel"
            target: "x86_64-apple-darwin"
            arch: "x86_64"
          - runner: "macos-15"
            target: "aarch64-apple-darwin"
            arch: "arm64"
          - runner: "macos-latest"
            target: "aarch64-apple-darwin"
            arch: "arm64"
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: "fixtures/sim/sim_k2_n50_r0.02"

      - name: "Download the binary"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: treeknit-${{ matrix.target }}
          path: ".out"

      # The simulated case and seed of dev/cross/test-distros. The output goes
      # to the runner's temporary directory, because the root file system of
      # macOS is read-only.
      - name: "Run the binary"
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$(uname -m)" == "${ARCH}" ]] || { printf 'Runner architecture %s, expected %s\n' "$(uname -m)" "${ARCH}" >&2; exit 1; }
          bin=".out/treeknit-${TARGET}"
          chmod +x "${bin}"
          version="$("${bin}" --version)"
          printf '%s\n' "${version}"
          if [[ -n "${RELEASE_VERSION}" && "${version}" != "treeknit ${RELEASE_VERSION}" ]]; then
            printf 'Expected "treeknit %s"\n' "${RELEASE_VERSION}" >&2
            exit 1
          fi
          case=fixtures/sim/sim_k2_n50_r0.02
          "${bin}" "${case}/tree1.nwk" "${case}/tree2.nwk" --seed=1 --outdir="${RUNNER_TEMP}/out"
          test -s "${RUNNER_TEMP}/out/MCCs.json"

  windows:
    name: "Windows"
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: "fixtures/sim/sim_k2_n50_r0.02"

      - name: "Download the binary"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: treeknit-x86_64-pc-windows-gnu
          path: ".out"

      - name: "Run the binary"
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $bin = ".\.out\treeknit-x86_64-pc-windows-gnu.exe"
          $version = & $bin --version
          Write-Output $version
          if ($env:RELEASE_VERSION -and $version -ne "treeknit $env:RELEASE_VERSION") {
            Write-Error "Expected `"treeknit $env:RELEASE_VERSION`""
          }
          $case = "fixtures\sim\sim_k2_n50_r0.02"
          & $bin "$case\tree1.nwk" "$case\tree2.nwk" --seed=1 --outdir="$env:RUNNER_TEMP\out"
          if (-not (Test-Path "$env:RUNNER_TEMP\out\MCCs.json")) {
            Write-Error "No MCCs.json in $env:RUNNER_TEMP\out"
          }

  wheels:
    name: "PyPI wheels"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Prepare the build container"
        uses: ./.github/actions/prepare
        with:
          cache: "wheels"
          dockerhub-username: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ github.event_name != 'pull_request' && secrets.NEHERLAB_BOT_DOCKERHUB_TOKEN || '' }}

      - name: "Download the binaries"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "treeknit-*"
          merge-multiple: true
          path: ".out"

      # The wheels stay outside .out/ and the artifact name does not start with
      # treeknit-, so the GitHub release never attaches them.
      - name: "Write the wheels"
        env:
          WHEEL_VERSION: ${{ inputs.wheel_version }}
        run: dev/docker/run dev/pypi-wheels --version "${WHEEL_VERSION}" .out tmp/pypi-wheels

      - name: "Upload"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-wheels
          path: tmp/pypi-wheels/*.whl
          if-no-files-found: error

  wheels-install:
    name: "PyPI wheels (${{ matrix.runner }})"
    needs: wheels
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: "ubuntu-24.04"
            tag: "manylinux_2_17_x86_64"
          - runner: "ubuntu-24.04-arm"
            tag: "manylinux_2_17_aarch64"
          - runner: "macos-15-intel"
            tag: "macosx_10_12_x86_64"
          - runner: "macos-15"
            tag: "macosx_11_0_arm64"
          - runner: "windows-2022"
            tag: "win_amd64"
    env:
      WHEEL_VERSION: ${{ inputs.wheel_version }}
    steps:
      - name: "Download the wheels"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-wheels
          path: "wheels"

      - name: "Set up Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      # pip picks the wheel of the runner's platform from the directory, as it
      # would from PyPI.
      - name: "Install with pip"
        env:
          TAG: ${{ matrix.tag }}
        run: |
          python -m pip download --quiet --no-index --no-deps --find-links=wheels --dest=picked "treeknit==${WHEEL_VERSION}"
          wheel=(picked/*.whl)
          printf 'pip picked %s\n' "${wheel[*]}"
          if [[ ${#wheel[@]} != 1 || "${wheel[0]}" != *"-py3-none-${TAG}"* ]]; then
            printf 'Expected one wheel with the tag %s\n' "${TAG}" >&2
            exit 1
          fi
          python -m venv venv
          bin="venv/bin"
          [[ "${RUNNER_OS}" != "Windows" ]] || bin="venv/Scripts"
          "${bin}/python" -m pip install --quiet --no-index "${wheel[0]}"
          version="$("${bin}/treeknit" --version)"
          printf '%s\n' "${version}"
          if [[ -n "${RELEASE_VERSION}" && "${version}" != "treeknit ${RELEASE_VERSION}" ]]; then
            printf 'Expected "treeknit %s"\n' "${RELEASE_VERSION}" >&2
            exit 1
          fi

      # pip on a musl system picks the musllinux wheel; setup-python has no musl
      # builds, so this runs in the Alpine image of Python.
      - name: "Install with pip on Alpine"
        if: matrix.runner == 'ubuntu-24.04'
        run: |
          docker run --rm --volume="${PWD}/wheels:/wheels:ro" --env=WHEEL_VERSION --env=RELEASE_VERSION python:3-alpine sh -euc '
            python -m pip download --quiet --no-index --no-deps --find-links=/wheels --dest=/tmp/picked "treeknit==${WHEEL_VERSION}"
            wheel="$(ls /tmp/picked)"
            printf "pip picked %s\n" "${wheel}"
            case "${wheel}" in
            *-py3-none-musllinux_1_1_x86_64.whl) ;;
            *) printf "Expected one wheel with the tag musllinux_1_1_x86_64\n" >&2; exit 1 ;;
            esac
            python -m venv /tmp/venv
            /tmp/venv/bin/python -m pip install --quiet --no-index "/tmp/picked/${wheel}"
            version="$(/tmp/venv/bin/treeknit --version)"
            printf "%s\n" "${version}"
            if [ -n "${RELEASE_VERSION}" ] && [ "${version}" != "treeknit ${RELEASE_VERSION}" ]; then
              printf "Expected \"treeknit %s\"\n" "${RELEASE_VERSION}" >&2
              exit 1
            fi
          '

  docker:
    name: "Docker images"
    if: inputs.docker
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Log in to Docker Hub"
        if: env.DOCKERHUB_LOGIN == '1'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_USERNAME }}
          password: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_TOKEN }}

      - name: "Set up QEMU"
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: "Download the Linux binaries"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "treeknit-*-linux-*"
          merge-multiple: true
          path: ".out"

      - name: "Build and run the images"
        run: dev/docker/prod-images --run
