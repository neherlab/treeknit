name: "Nightly"

# Every night, when main has changed since the latest nightly: build the CLI for
# every release target, publish the binaries that build as a release on the
# releases page, and deploy the web app to GitHub Pages.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even when main has not changed since the latest nightly"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  # With the Docker Hub token, dev/docker/run pushes the images it builds, so
  # later runs pull them instead of building them again.
  TREEKNIT_DOCKER_PUSH: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_TOKEN != '' && '1' || '' }}

jobs:
  version:
    name: "Version"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      suffix: ${{ steps.version.outputs.suffix }}
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: "Cargo.toml"
          sparse-checkout-cone-mode: false

      # The tag ends with the short source commit, so a latest release with the
      # same commit means main is unchanged; the outputs stay empty then, and
      # the other jobs are skipped.
      - name: "Resolve the version"
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force == true }}
        run: |
          short_sha="${GITHUB_SHA:0:7}"
          latest="$(gh release list --repo="${GITHUB_REPOSITORY}" --limit=1 --json=tagName --jq='.[0].tagName // ""')"
          if [[ "${latest}" == *"+${short_sha}" && "${FORCE}" != "true" ]]; then
            printf 'main is unchanged since the latest nightly %s\n' "${latest}"
            exit 0
          fi
          suffix="nightly.$(date -u '+%Y%m%dT%H%M%SZ')+${short_sha}"
          tag="$(yq -p toml -o yaml '.workspace.package.version' Cargo.toml)-${suffix}"
          printf 'Version: %s\n' "${tag}"
          printf 'tag=%s\nsuffix=%s\n' "${tag}" "${suffix}" >>"${GITHUB_OUTPUT}"

  build:
    name: "Build (${{ matrix.target }})"
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # A failed target leaves only its binary out of the release.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-darwin
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - x86_64-apple-darwin
          - x86_64-pc-windows-gnu
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
    env:
      CROSS_COMPILE: ${{ matrix.target }}
      TREEKNIT_VERSION_SUFFIX: ${{ needs.version.outputs.suffix }}
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Log in to Docker Hub"
        if: env.TREEKNIT_DOCKER_PUSH == '1'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_USERNAME }}
          password: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_TOKEN }}

      - name: "Build"
        run: dev/docker/run dev/cross/build --profile=dist treeknit

      - name: "Upload"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: treeknit-${{ matrix.target }}
          path: .out/treeknit-${{ matrix.target }}*
          # The action skips paths under a directory whose name starts with a dot, such as .out/.
          include-hidden-files: true
          if-no-files-found: error

  publish:
    name: "Publish the release"
    needs: [version, build]
    if: ${{ !cancelled() && needs.version.outputs.tag != '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: "Download the binaries"
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "treeknit-*"
          merge-multiple: true
          path: ".out"

      # GitHub appends the pull requests merged since the previous release.
      - name: "Publish"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          NOTES: |
            Nightly build of `main` for early testing. It may contain bugs and breaking changes.

            - **Linux and macOS**: make the downloaded file executable with `chmod +x <file>`
            - **Linux**: the musl builds are static and run on any distribution; the glibc builds need glibc 2.17 or newer
            - **macOS**: the executables are not signed by a registered developer. If macOS refuses to run one, run `xattr -d com.apple.quarantine <file>`
            - **CPU**: the x86_64 builds need a Haswell (2013) or newer CPU, the Linux ARM64 builds an ARMv8.2-A CPU
        run: |
          gh release create "${TAG}" --repo="${GITHUB_REPOSITORY}" --target="${GITHUB_SHA}" --title="${TAG}" \
            --notes="${NOTES}" --generate-notes .out/treeknit-*

  deploy-web:
    name: "Deploy the web app"
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: "github-pages"
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Log in to Docker Hub"
        if: env.TREEKNIT_DOCKER_PUSH == '1'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_USERNAME }}
          password: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_TOKEN }}

      - name: "Build"
        run: dev/docker/run just build-web prod

      - name: "Upload"
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "packages/web/dist"

      - name: "Deploy"
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
