name: "Checks"

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  CARGO_INCREMENTAL: "0"
  KACHE_STORE: ${{ github.workspace }}/.cache/kache
  FORCE_COLOR: "1"

jobs:
  check:
    name: "Check (${{ matrix.name }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "lint"
            command: "just check"
          - name: "config lints"
            command: "dev/run-checks --serial lint-shell lint-py lint-docker lint-workflows"
          - name: "tests"
            command: "dev/run-checks --serial check-group:tests test-ts"
          - name: "generated files"
            command: "just generated-check"
    steps:
      - name: "Check out"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Prepare the build container"
        uses: ./.github/actions/prepare
        with:
          cache: ${{ matrix.name }}
          dockerhub-username: ${{ secrets.NEHERLAB_BOT_DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ github.event_name != 'pull_request' && secrets.NEHERLAB_BOT_DOCKERHUB_TOKEN || '' }}

      - name: "Run ${{ matrix.name }}"
        run: dev/docker/run ${{ matrix.command }}
