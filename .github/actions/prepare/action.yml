name: "Prepare the build container"
description: "Set the build environment, restore the cargo, compiler, and Bun caches, and pull or build the container image"

inputs:
  image:
    description: "Image of dev/docker/run: native, or a release target of dev/cross/targets"
    default: "native"
  cache:
    description: "Name of the compiler cache of this job"
    required: true
  dockerhub-username:
    description: "Docker Hub user"
    default: ""
  dockerhub-token:
    description: "Docker Hub token; on the base branch outside pull requests, the image and its layer cache are pushed with it"
    default: ""

runs:
  using: "composite"
  steps:
    # The environment holds for the later steps of the job. Every run starts
    # without incremental state, so incremental compiles only add overhead, and
    # kache caches only compiles without it.
    - name: "Set the build environment"
      id: env
      shell: bash
      env:
        PUSH: ${{ inputs.dockerhub-token != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      run: |
        {
          printf 'CARGO_INCREMENTAL=0\n'
          printf 'KACHE_STORE=%s\n' "${GITHUB_WORKSPACE}/.cache/kache"
          printf 'FORCE_COLOR=1\n'
        } >>"${GITHUB_ENV}"
        printf 'push=%s\n' "${PUSH}" >>"${GITHUB_OUTPUT}"

    - name: "Log in to Docker Hub"
      if: ${{ steps.env.outputs.push == 'true' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: "Set up Docker Buildx"
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: "Restore the cargo registry"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .cache/cargo/registry/index/
          .cache/cargo/registry/cache/
          .cache/cargo/git/db/
        key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: cargo-registry-

    - name: "Restore the compiler cache"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/kache/
        key: kache-${{ inputs.cache }}-${{ inputs.image }}-${{ hashFiles('.config/mise.lock') }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: kache-${{ inputs.cache }}-${{ inputs.image }}-${{ hashFiles('.config/mise.lock') }}-

    - name: "Restore the Bun package cache"
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/bun/
        key: bun-${{ hashFiles('bun.lock') }}
        restore-keys: bun-

    - name: "Pull or build the image"
      shell: bash
      env:
        CROSS_COMPILE: ${{ inputs.image }}
        TREEKNIT_DOCKER_PUSH: ${{ steps.env.outputs.push == 'true' && '1' || '' }}
      run: dev/docker/run true
