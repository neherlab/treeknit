# Cargo prints warnings, errors, and the output of the programs it runs, but no
# status line for each crate it downloads or compiles. The setting applies to
# every cargo command in the checkout: on the host, in the build container, and
# in CI. `--verbose` or CARGO_TERM_QUIET=false shows the status lines.
# `cargo install` reads no project configuration; .config/mise.toml silences the
# tools that mise builds with it.
[term]
quiet = true

# Settings of the kache compiler cache, which cargo passes to the rustc wrapper.
# `force` overrides the environment, so every checkout and worktree compiles
# with the same settings.
# - KACHE_BASE_DIR normalizes the build path, so every checkout and worktree
#   produces identical cache keys
# - the other settings turn off kache's miss explanations, heartbeat, and
#   progress output
[env]
KACHE_BASE_DIR = { value = ".", relative = true, force = true }
KACHE_EXPLAIN_MISS = { value = "0", force = true }
KACHE_HEARTBEAT_SECS = { value = "0", force = true }
KACHE_PROGRESS = { value = "off", force = true }
# jemalloc fixes its page size when it is built, to the page of the build host
# unless told otherwise, and fails to start on a kernel with larger pages. The
# aarch64 Linux kernels use 4, 16, or 64 KiB pages, so the aarch64 builds of the
# CLI take 64 KiB (2^16), which runs on all of them at some cost in memory. The
# build script of tikv-jemalloc-sys reads the variable with the target prefix
# first, so the setting applies to these targets only.
AARCH64_UNKNOWN_LINUX_GNU_JEMALLOC_SYS_WITH_LG_PAGE = "16"
AARCH64_UNKNOWN_LINUX_MUSL_JEMALLOC_SYS_WITH_LG_PAGE = "16"

# The same flags for every native build, test, and lint, so these never
# invalidate each other's artifacts:
# - mold links fast; the link runs on every edit and is never cached
# - frame pointers and v0 symbol mangling give profilers and backtraces full
#   stacks and generic paths
[target.x86_64-unknown-linux-gnu]
rustflags = ["-Clink-arg=-fuse-ld=mold", "-Cforce-frame-pointers=yes", "-Csymbol-mangling-version=v0"]

# `cargo test --target wasm32-unknown-unknown` runs the tests in Node through the
# runner of wasm-bindgen-cli, whose version must equal the wasm-bindgen pin.
[target.wasm32-unknown-unknown]
runner = "wasm-bindgen-test-runner"
